[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = .
addopts = -ra --strict-markers
markers =
    live_gemini: real Gemini call; runs only with QC_LIVE_GEMINI=1
    live_render: read-only GET against the Render deployment; runs only with QC_LIVE_RENDER=1
filterwarnings =
    ignore::DeprecationWarning
